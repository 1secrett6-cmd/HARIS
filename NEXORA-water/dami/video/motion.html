<!doctype html>
<html><head><meta charset="utf-8">
<style>
/*FONT*/
* { box-sizing:border-box; margin:0; padding:0 }
html, body { width:1920px; height:1080px; overflow:hidden; background:#0C0306 }
body { font-family:'Cairo','Segoe UI',sans-serif; color:#fff }
#stage { position:absolute; inset:0; overflow:hidden; background:radial-gradient(circle at 50% 45%,#3B0A10 0%,#14040A 55%,#07020A 100%) }
#glow { position:absolute; left:50%; top:45%; width:1400px; height:1400px; margin:-700px; border-radius:50%; background:radial-gradient(circle,#DC262640,transparent 60%) }
.grid { position:absolute; inset:0; background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px); background-size:80px 80px }
.sc { position:absolute; inset:0; display:none }
.abs { position:absolute }
.c { left:0; right:0; text-align:center }
.t1 { font-size:110px; font-weight:900; line-height:1.05 } .t2 { font-size:64px; font-weight:900 } .t3 { font-size:40px; font-weight:700 } .t4 { font-size:30px; font-weight:600; opacity:.85 }
.red { color:#F87171 } .muted { color:#FECACA }
.drop { width:120px; height:120px; border-radius:50% 0 50% 50%; transform:rotate(-45deg); background:linear-gradient(135deg,#F87171,#B91C1C); box-shadow:0 0 80px #DC2626aa }
.ring { border:4px solid #F87171; border-radius:50% }
.card { background:linear-gradient(160deg,#ffffff14,#ffffff06); border:1.5px solid #ffffff22; border-radius:28px; padding:34px; backdrop-filter:blur(4px) }
.card .i { font-size:72px } .card b { display:block; font-size:40px; margin:10px 0 8px } .card p { font-size:26px; line-height:1.45; color:#FDE2E2 }
.pill { display:inline-block; background:#DC2626; border-radius:99px; padding:14px 40px; font-size:46px; font-weight:900; box-shadow:0 0 60px #DC2626aa }
.hosp { width:640px; height:460px }
.bar { height:40px; border-radius:20px; background:#ffffff18; overflow:hidden } .bar i { display:block; height:100%; border-radius:20px }
.chip { background:#ffffff12; border:1px solid #ffffff30; border-radius:20px; padding:18px 30px; font-size:30px }
.chip b { color:#F87171; font-size:44px; display:block; font-weight:900 }
.panel { background:#ffffff0c; border:1.5px solid #ffffff22; border-radius:30px }
.tele { display:grid; grid-template-columns:1fr 1fr; gap:14px } .tele div { background:#ffffff10; border-radius:18px; padding:14px 18px; font-size:22px; color:#FECACA } .tele b { display:block; font-size:44px; color:#fff }
.shot { border-radius:22px; overflow:hidden; box-shadow:0 40px 120px #000c, 0 0 0 2px #ffffff22 } .shot img { display:block; width:100% }
.rev { width:400px } .rev b { font-size:56px; color:#fff } .rev span { font-size:26px; color:#FECACA; display:block }
.node { width:44px; height:44px; border-radius:50%; background:#DC2626; box-shadow:0 0 0 10px #DC262633 }
.ph { width:360px; text-align:center } .ph b { display:block; font-size:34px; color:#F87171 } .ph span { font-size:26px; line-height:1.4; color:#FDE2E2 }
#brand { position:absolute; top:44px; font-size:24px; letter-spacing:.45em; font-weight:900; opacity:.55 }
#prog { position:absolute; left:0; bottom:0; height:6px; background:linear-gradient(90deg,#B91C1C,#F87171) }
#sub { position:absolute; bottom:58px; left:0; right:0; text-align:center; font-size:30px; font-weight:600; color:#FFE4E6; opacity:.9 }
</style></head>
<body><div id="stage"><div id="glow"></div><div class="grid"></div>

      <div class="t4" id="cl" style="margin-top:6px"></div><div style="font-size:60px;font-weight:900;color:#A8A29E;direction:ltr" id="ctime">0:00</div></div>

    <div class="abs c pill" id="arr" style="position:relative;margin-top:26px;font-size:36px;display:block;text-align:center"></div>
  </div>
</div>

<!-- 6 app -->
<div class="sc" id="s6">

  <div class="abs shot" id="sh0" style="left:350px;top:165px;width:1220px"><img id="im0"></div>

    <text id="pct" x="260" y="285" text-anchor="middle" font-size="110" font-weight="900" fill="#fff">0%</text>
  </svg>
  <div class="abs t3" id="gm" style="left:1260px;width:520px;text-align:center;top:800px"></div>
</div>

<!-- 8 roadmap -->
<div class="sc" id="s8">

  <div class="abs" id="line" style="left:200px;top:470px;height:8px;border-radius:4px;background:linear-gradient(90deg,#B91C1C,#F87171)"></div>
  <div id="phases"></div>
</div>

<!-- 9 closer -->
<div class="sc" id="s9">
  <div class="abs c t1" id="q1" style="top:300px"></div>
  <div class="abs c t1 red" id="q2" style="top:440px"></div>
  <div class="abs c t2" id="end" style="top:680px"></div>
  <div class="abs c t4" id="end2" style="top:790px"></div>
</div>

<div id="brand">NEXORA</div><div id="sub"></div><div id="prog"></div>
</div>
<script>
const L = __LANG__, SHOTS = __SHOTS__;
const T = {
 ar:{dir:"rtl",logo:"دَمي",tag:"الوحدة المناسبة من الدم، للمستشفى المناسب… وبالدرون إذا ما في وقت",acc:"حادث على طريق المطار",need:"مطلوب الآن: 6 وحدات O−",
  pt:"نقص هنا… وهدر هناك",hAn:"مستشفى الأطراف",hAt:"ينتظر زمرة O− ولا يملكها",hBn:"مستشفى آخر",hBt:"وحدات تنتهي صلاحيتها خلال 48 ساعة",hBv:"⏳ هدر",

  st:"الحل: دَمي",layers:[["🧠","يتنبأ ويوازن","يتوقع طلب كل زمرة ويوازن المخزون قبل ما ينتهي"],["🫂","يستدعي المتبرع","المؤهل والقريب، للزمرة الناقصة بالذات"],["🚁","درون إسعاف الدم","صندوق مبرّد 2–6°م من بنك الدم للمستشفى"]],
  mt:"مهمة الدرون: من بنك الدم إلى المستشفى",lb1:"بنك الدم",lb2:"المستشفى",dl:"🚁 بالدرون",cl:"🚗 بالسيارة (ذروة)",tl1:"حرارة الصندوق",tl2:"البطارية",arr:"✅ وصلت · وفّرنا 25 دقيقة",

 en:{dir:"ltr",logo:"DAMI",tag:"The right blood unit, to the right hospital… and by drone when there's no time",acc:"An accident on the Airport Road",need:"Needed now: 6 units of O−",
  pt:"Shortage here… waste there",hAn:"Outskirts Hospital",hAt:"Needs O− and has none",hBn:"Another hospital",hBt:"Units expiring within 48 hours",hBv:"⏳ Waste",

  st:"The solution: DAMI",layers:[["🧠","Forecast & balance","Predicts demand per blood type and rebalances stock before it expires"],["🫂","Call the right donor","Eligible, nearby, for exactly the missing type"],["🚁","Blood ambulance drone","A 2–6°C cooled box from blood bank to hospital"]],
  mt:"The drone mission: blood bank → hospital",lb1:"Blood bank",lb2:"Hospital",dl:"🚁 By drone",cl:"🚗 By car (peak)",tl1:"Box temperature",tl2:"Battery",arr:"✅ Delivered · 25 min saved",

  bt:"Business model",revs:[["JOD 6,000","annual hospital subscription"],["JOD 90","per emergency drone flight"],["JOD 40,000","national dashboard contract"],["JOD 10,000","donor-app sponsorship"]],gm:"Year-3 gross margin",

  subs:[[0,4,""],[4.3,9,"5 p.m. — a hospital needs O negative blood, now"],[9.3,14,"The problem: shortages in one place, expiring units in another"],[14.3,20,"DAMI: a three-layer AI platform"],[20.3,31,"The drone arrives in 9 minutes instead of 34, box steady at 4°C"],[31.3,36,""],[36.3,42,"Clear revenue from hospitals, the ministry and sponsors"],[42.3,47,"Software first, then the first licensed flight"]]},

const $ = (s) => document.querySelector(s);
document.body.dir = T.dir;
["logo","tag","acc","need","pt","hAn","hAt","hBn","hBt","hBv","st","mt","dl","cl","tl1","tl2","arr","at","bt","gm","rt","q1","q2","end","end2"].forEach((k) => $("#" + k).textContent = T[k]);
$("#lb1").textContent = T.lb1; $("#lb2").textContent = T.lb2;
$("#brand").style[T.dir === "rtl" ? "right" : "left"] = "60px";
$("#facts").innerHTML = T.facts.map(([a, b]) => `<div class="chip"><b>${a}</b>${b}</div>`).join("");
$("#layers").innerHTML = T.layers.map(([i, a, b]) => `<div class="card"><div class="i">${i}</div><b>${a}</b><p>${b}</p></div>`).join("");
$("#revs").innerHTML = T.revs.map(([a, b]) => `<div class="card rev"><b style="direction:ltr;unicode-bidi:isolate">${a}</b><span>${b}</span></div>`).join("");
const NX = (i) => T.dir === "rtl" ? 1720 - i * 1520 / 3 : 200 + i * 1520 / 3;
$("#phases").innerHTML = T.phases.map(([a, b], i) => `<div class="abs node" id="n${i}" style="left:${NX(i) - 22}px;top:452px"></div><div class="abs ph" id="p${i}" style="left:${NX(i) - 180}px;top:${i % 2 ? 540 : 260}px"><b>${a}</b><span>${b}</span></div>`).join("");
[0, 1, 2].forEach((i) => $("#im" + i).src = SHOTS[i]);

const cl = (x) => Math.max(0, Math.min(1, x)), pr = (t, a, b) => cl((t - a) / (b - a));
const eo = (x) => 1 - Math.pow(1 - x, 3), eb = (x) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function win(id, t, a, b, f = .45) { const el = $(id); const o = Math.min(pr(t, a, a + f), 1 - pr(t, b - f, b)); el.style.display = o > 0 ? "block" : "none"; el.style.opacity = o; return o > 0; }
function enter(id, t, a, d = .6, dy = 50, sc = 1) { const el = $(id); const k = pr(t, a, a + d); const e = eb(k);
  el.style.opacity = eo(k); el.style.transform = `translateY(${(1 - e) * dy}px) scale(${sc + (1 - sc) * e})`; }
function along(path, k) { const p = $(path), len = p.getTotalLength(), pt = p.getPointAtLength(len * cl(k)); return pt; }
const mmss = (m) => { const s = Math.round(m * 60); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const DUR = 52;

window.render = function (t) {
  $("#prog").style.width = (t / DUR * 100) + "%";
  $("#glow").style.transform = `scale(${1 + .06 * Math.pow(Math.max(0, Math.sin(t * Math.PI * 1.6)), 8)})`;
  const sb = T.subs.find(([a, b]) => t >= a && t < b); $("#sub").textContent = sb ? sb[2] : ""; $("#sub").style.opacity = sb ? Math.min(pr(t, sb[0], sb[0] + .3), 1 - pr(t, sb[1] - .3, sb[1])) : 0;

    [["#r1", 1.1], ["#r2", 1.4]].forEach(([r, s]) => { const q = pr(t, s, s + 1.4); const el = $(r); el.style.opacity = q > 0 ? 1 - q : 0; el.style.transform = `scale(${1 + q * 9})`; });
    enter("#logo", t, 1.5, .7, 60, .8); enter("#tag", t, 2.3, .7, 40);

  }
  if (win("#s4", t, 14, 20.3)) {

  }
  if (win("#s5", t, 20, 31.3)) {
    enter("#mt", t, 20.1, .6);
    const kd = pr(t, 21.5, 27), cm = t < 27 ? 9 * Math.max(0, t - 21.5) / 5.5 : 9 + 25 * eo(pr(t, 27, 30.5)), kc = cm / 34;
    const pd = along("#air", eo(kd) * .999 + .0005), pc = along("#road", kc);
    $("#drn").setAttribute("transform", `translate(${pd.x},${pd.y - 10 * Math.sin(t * 8) * (kd < 1 ? 1 : 0)})`); $("#car").setAttribute("transform", `translate(${pc.x},${pc.y})`);

    $("#dtime").textContent = mmss(9 * kd); $("#ctime").textContent = mmss(cm);

    const ka = pr(t, 27.2, 27.8); $("#arr").style.opacity = ka; $("#arr").style.transform = `scale(${.6 + .4 * eb(ka)})`;
